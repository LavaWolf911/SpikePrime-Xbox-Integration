<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pybricks Teaching Hub</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="header">
        <img class="header-logo" src="logo.png" alt="Logo" />
        <p class="header-text">Pybricks Teaching Hub</p>
        <button id="auth-btn" class="auth-button">Log In</button>
    </div>

    <div class="sidebar">
        <div class="sidebar-sections-div"><a href="#" onclick="showPage('home')" class="sidebar-link">
                <p class="side-bar-text">Home</p>
            </a></div>
        <div class="sidebar-sections-div"><a href="#" onclick="showPage('start')" class="sidebar-link">
                <p class="side-bar-text">Getting Started</p>
            </a></div>
        <div class="sidebar-sections-div"><a href="#" onclick="showPage('learn')" class="sidebar-link">
                <p class="side-bar-text">Learn</p>
            </a></div>

        <div class="sidebar-sections-div dropdown-toggle" onclick="toggleDropdown('examples-dropdown')">
            <p class="side-bar-text">Examples ▼</p>
        </div>
        <div id="examples-dropdown" class="dropdown-content" style="display: none;">
            <a href="#" onclick="showPage('example1')">
                <p class="side-bar-text">Drive Base w/ Xbox Controller</p>
            </a>
            <a href="#" onclick="showPage('example2')">
                <p class="side-bar-text">Robot Arm</p>
            </a>
            <a href="#" onclick="showPage('example3')">
                <p class="side-bar-text">Example 3</p>
            </a>
        </div>

        <div class="sidebar-sections-div"><a href="#" onclick="showPage('resources')" class="sidebar-link">
                <p class="side-bar-text">Resources</p>
            </a></div>
    </div>

    <div class="msection-page">
        <div id="home" class="page-section"></div>
        <div id="start" class="page-section" style="display: none;"></div>
        <div id="learn" class="page-section" style="display: none;"></div>
        <div id="resources" class="page-section" style="display: none;"></div>
        <div id="example1" class="page-section" style="display: none;"></div>
        <div id="example2" class="page-section" style="display: none;"></div>
        <div id="example3" class="page-section" style="display: none;"></div>
    </div>

    <script>
        function showPage(id) {
            history.pushState(null, '', '/' + id); 

            const pages = document.querySelectorAll('.page-section');
            pages.forEach(p => p.style.display = 'none');

            const section = document.getElementById(id);
            if (!section) return;

            section.style.display = 'block';

            fetch("data/" + id + '.html')
                .then(response => {
                    if (!response.ok) throw new Error('Page not found');
                    return response.text();
                })
                .then(html => {
                    section.innerHTML = html;
                })
                .catch(() => {
                    section.innerHTML = '<p style="color:red;">Page could not be loaded.</p>';
                });
        }

        function toggleDropdown(id) {
            const dropdown = document.getElementById(id);
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        document.getElementById('auth-btn').addEventListener('click', function () {
            isSignedIn = !isSignedIn;
            this.textContent = isSignedIn ? 'Sign Out' : 'Log In';
        });

        let isSignedIn = false;

        const currentPath = window.location.pathname.replace('/', '') || 'home';
        showPage(currentPath);

        window.onpopstate = () => {
            const path = window.location.pathname.replace('/', '') || 'home';
            showPage(path);
        };
    </script>
</body>

</html>
