<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pybricks Teaching Hub</title>
  <link rel="stylesheet" href="data/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="header">
    <img class="header-logo" src="data/logo.png" alt="Logo" />
    <p class="header-text">Pybricks Teaching Hub</p>
    <button id="auth-btn" class="auth-button">Log In</button>
  </div>

  <div class="sidebar">
    <div class="sidebar-sections-div"><a href="/home" class="sidebar-link">
      <p class="side-bar-text">Home</p>
    </a></div>

    <div class="sidebar-sections-div"><a href="/start" class="sidebar-link">
      <p class="side-bar-text">Getting Started</p>
    </a></div>

    <div class="sidebar-sections-div"><a href="/learn/" class="sidebar-link">
      <p class="side-bar-text">Learn</p>
    </a></div>

    <div class="sidebar-sections-div dropdown-toggle" onclick="toggleDropdown('examples-dropdown')">
      <p class="side-bar-text">Examples ▼</p>
    </div>
    <div id="examples-dropdown" class="dropdown-content" style="display: none;">
      <a href="/example1" class="sidebar-link"><p class="side-bar-text">Drive Base w/ Xbox Controller</p></a>
      <a href="/example2" class="sidebar-link"><p class="side-bar-text">Robot Arm</p></a>
      <a href="/example3" class="sidebar-link"><p class="side-bar-text">Example 3</p></a>
    </div>

    <div class="sidebar-sections-div"><a href="/resources" class="sidebar-link">
      <p class="side-bar-text">Resources</p>
    </a></div>
  </div>

  <div class="msection-page">
    
  </div>

  <script>
    function toggleDropdown(id) {
      const dropdown = document.getElementById(id);
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
    
    let isSignedIn = false;
    document.getElementById('auth-btn').addEventListener('click', function () {
      isSignedIn = !isSignedIn;
      this.textContent = isSignedIn ? 'Sign Out' : 'Log In';
    });
  </script>
</body>
</html>
