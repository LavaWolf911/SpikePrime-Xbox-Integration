<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learn - Pybricks Teaching Hub</title>
  <link rel="stylesheet" href="..\main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="header">
    <img class="header-logo" src="..\logo.png" alt="Logo" />
    <p class="header-text">Pybricks Teaching Hub - Learn</p>
    <button id="auth-btn" class="auth-button">Log In</button>
  </div>

  <div class="sidebar">
    <div class="sidebar-sections-div"><a href="../" class="sidebar-link">
      <p class="side-bar-text">Home</p>
    </a></div>
    <div class="sidebar-sections-div"><a href="#" onclick="showPage('hubs')" class="sidebar-link">
      <p class="side-bar-text">Hubs</p>
    </a></div>
    <div class="sidebar-sections-div"><a href="#" onclick="showPage('motors')" class="sidebar-link">
      <p class="side-bar-text">Motors</p>
    </a></div>
    <div class="sidebar-sections-div"><a href="#" onclick="showPage('controllers')" class="sidebar-link">
      <p class="side-bar-text">Controllers</p>
    </a></div>
  </div>

  <div class="msection-page">
    <div id="hubs" class="page-section"></div>
    <div id="motors" class="page-section" style="display:none;"></div>
    <div id="controllers" class="page-section" style="display:none;"></div>
  </div>

  <script>
    function showPage(id) {
      const pages = document.querySelectorAll('.page-section');
      pages.forEach(p => p.style.display = 'none');

      const section = document.getElementById(id);
      if (!section) return;
      section.style.display = 'block';

      fetch(`data/${id}.html`)
        .then(response => {
          if (!response.ok) throw new Error('Page not found');
          return response.text();
        })
        .then(html => {
          section.innerHTML = html;
        })
        .catch(() => {
          section.innerHTML = '<p style="color:red;">Content could not be loaded.</p>';
        });
    }

    // Load 'hubs' page by default
    showPage('hubs');

    // Toggle sign-in button text
    let isSignedIn = false;
    document.getElementById('auth-btn').addEventListener('click', function () {
      isSignedIn = !isSignedIn;
      this.textContent = isSignedIn ? 'Sign Out' : 'Log In';
    });
  </script>
</body>
</html>
